# Publishes all three packages when a GitHub release is published, all without stored
# tokens: PyPI and npm use trusted publishing and the MCP registry uses GitHub OIDC.
# npm packages are staged and wait for Peter's approval on npmjs.com.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use npm 12 (staged publishing)
        run: npm install -g npm@12
      # No token: npm trusts this workflow through OIDC. Packages are staged, then
      # Peter approves each one on npmjs.com with his security key before it goes public.
      - name: Stage plures
        working-directory: js
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "plures@$V" version >/dev/null 2>&1; then echo "plures@$V is already published"; exit 0; fi
          npm install --no-audit --no-fund
          npm stage publish --access public
      - name: Stage plures-mcp
        working-directory: mcp
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "plures-mcp@$V" version >/dev/null 2>&1; then echo "plures-mcp@$V is already published"; exit 0; fi
          # Build against this commit's SDK, which may still be waiting for approval.
          (cd ../js && npm pack --silent)
          npm install --no-audit --no-fund --no-save ../js/plures-*.tgz
          npm install --no-audit --no-fund
          npm stage publish --access public
      - name: Approve on npm
        run: echo "Staged. Approve each package at https://www.npmjs.com (Settings, or npm stage list) to publish it."

  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: python
        run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          skip-existing: true

  mcp-registry:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Wait until npm shows plures-mcp
        working-directory: mcp
        run: |
          V=$(node -p "require('./package.json').version")
          # Waits up to two hours for the staged npm package to be approved.
          for i in $(seq 1 360); do
            curl -sf "https://registry.npmjs.org/plures-mcp/$V" >/dev/null && exit 0
            sleep 20
          done
          echo "plures-mcp@$V never appeared on npm"; exit 1
      - name: Publish to the MCP registry
        working-directory: mcp
        run: |
          ../mcp-publisher login github-oidc
          ../mcp-publisher publish
